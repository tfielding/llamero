# signal-ollama configuration: copy to /opt/signal-ollama/config/config.yml (mounted at /config).
# Everything is optional except a messaging app (transports: signal, with its number and
# allowed_senders). Every setting can also be given as an environment variable (see README),
# which wins over this file.
# ${VAR} is filled in from the environment, so secrets can stay in your .env file.
# Invalid settings or unknown keys stop signal-ollama at startup with a message saying which.

transports:                             # the messaging apps the bot talks on
  signal:
    url: http://signal-cli-rest-api:8080
    number: ${SIGNAL_NUMBER}
    allowed_senders: ${SIGNAL_ALLOWED_SENDERS} # or a list: [+15550000001, +15550000002]

ollama:
  url: http://192.168.1.50:11434
  model: llama3.2:latest                # default: the first installed model
  # vision_model: gemma3:4b             # answers photos when the chat's model can't see
  # timeout: 5m
  # wake_on_lan:
  #   mac: aa:bb:cc:dd:ee:ff
  #   addr: 192.168.1.255:9
  #   wait: 60s

# history:
#   limit: 40
#   summary: true
#   summary_model: llama3.2:latest
# system_prompt: You are a helpful assistant ...
# reaction: 👀
# health:
#   addr: ":8092"                       # GET /healthz for Docker and monitoring; off to disable
# schedules:
#   enabled: true                       # scheduled checks: ask "every weekday at 7:30 tell me ..."
# webhooks:                            # events from other systems: POST /hooks/<name> (see README)
#   token: ${WEBHOOK_TOKEN}             # callers send "Authorization: Bearer <token>"
#   hooks:
#     front_door:
#       task: Find out who or what it was, with the cameras, and say so in one sentence.
#       only_if: a person came to the door
#       # to: [+15550000001]            # default: everyone in allowed_senders
#       # group: 30s                    # events this close together are checked in one run
#       # wake: false                   # wake the Ollama machine for it (needs wake_on_lan)
#       # cooldown: 5m                  # after a message, skip events with the same key this long
#       # model: gemma3:12b             # the model for its checks; default: the chat's
#       # think: off                    # thinking for its checks; default: the chat's /think
#       # tools: [get_snapshot]         # only these tools; default: every read-only tool
#     leak: {}                          # no task: events are sent on as they are
# knowledge:                           # notes for the model: .md files in this folder
#   dir: /config/knowledge
#   max_chars: 8000

mcp:
  allow_write: false                    # default for servers below: false, ask or true
  # tools: [get_snapshot]               # allowlist of tool names across all servers
  # max_result_chars: 32000
  servers:
    cams:
      url: http://go2rtc-mcp:8090/mcp
    frigate:
      url: http://frigate-mcp:8091/mcp
      knowledge: frigate.md             # notes in the knowledge folder, given with these tools
    ha:
      url: http://homeassistant:8123/api/mcp
      token: ${HA_TOKEN}
      allow_write: ask                  # this server's tools that change things wait for your OK
      knowledge: ha.md                  # must exist; without this line, ha.md is used if it's there
      # tools: [GetLiveContext, HassTurnOn, HassTurnOff]   # only these of its tools
