# Add the llamero service to your compose file. With Signal, add it to the file that already runs
# signal-cli-rest-api (MODE=json-rpc), so they share a Docker network. Telegram needs nothing else.
services:
  llamero:
    container_name: llamero
    build: ./llamero          # path to this repo
    restart: always
    # Settings can go here as environment variables, or in /opt/llamero/config/config.yml
    # (see config.example.yml), or both; environment variables win.
    environment:
      - TZ=America/New_York             # your time zone, for scheduled checks
      - SIGNAL_URL=http://signal-cli-rest-api:8080
      - SIGNAL_NUMBER=+1XXXXXXXXXX      # number already registered in signal-cli-rest-api
      - SIGNAL_ALLOWED_SENDERS=+1YYYYYYYYYY   # your phone; comma-separate to add more
      # - TELEGRAM_TOKEN=123456789:AAH...        # and/or Telegram: a bot from @BotFather
      # - TELEGRAM_ALLOWED_SENDERS=123456789     # Telegram user ids
      - OLLAMA_URL=http://192.168.1.XX:11434
      # - OLLAMA_MODEL=llama3.2:latest  # default: first installed model
      # - HISTORY_LIMIT=40
      # - HISTORY_SUMMARY=true          # summarize older messages instead of dropping them
      # - SUMMARY_MODEL=llama3.2:latest # default: the chat's model
      # - SYSTEM_PROMPT=...
      # - OLLAMA_WOL_MAC=aa:bb:cc:dd:ee:ff   # wake the Ollama machine when it's asleep
      # - OLLAMA_WOL_ADDR=192.168.1.255:9    # your LAN's broadcast address
      # - MCP_SERVERS=cams=http://<go2rtc-mcp-host>:8090/mcp   # tools from MCP servers
      # - MCP_TOKEN_CAMS=...                                   # if that server has AUTH_TOKEN set
    volumes:
      # Like Frigate: config is what you write, data is what the bot writes.
      #   sudo mkdir -p /opt/llamero/config/knowledge /opt/llamero/data
      #   sudo chown 65532:65532 /opt/llamero/data    # the image runs as uid 65532
      - /opt/llamero/config:/config:ro   # config.yml (optional) and knowledge/*.md (see README)
      - /opt/llamero/data:/data          # chat history
    healthcheck:                         # "healthy" in docker ps; see README, Health
      test: ["CMD", "/llamero", "-healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
    depends_on:                          # with Signal
      - signal-cli-rest-api
